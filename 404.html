<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>放款狀態</title>
<meta name="robots" content="noindex, nofollow">
<script>
  // 404 導向回到包覆頁主頁（保留 ?page=... 那類參數）
  (function () {
    var p = location.pathname.replace(/index\.html$/i, "").replace(/404\.html$/i, "");
    var i = p.indexOf("/", 1);
    var root = (i < 0) ? "/" : p.slice(0, i + 1);
    location.replace(root + location.search);
  })();
</script>
</head>
<body>
找不到頁面：<a href="./">回到放款狀態頁</a>
</body>
</html>
